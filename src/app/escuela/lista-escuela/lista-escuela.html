<br /><br />
<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">
  <h1 class="text-3xl font-bold text-gray-900 mb-6">Lista Alumnos</h1>

  <form [formGroup]="formulario" >
    <!-- Matricula -->
    <div class="mb-5">
      <label for="name" class="block mb-2 text-sm font-medium text-gray-900"> Matricula </label>

      <input
        type="text"
        formControlName="matricula"
        id="matricula"
        name="matricula"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Enter your name"
      />
    </div>

    <!-- Nombre -->
    <div class="mb-5">
      <label for="name" class="block mb-2 text-sm font-medium text-gray-900"> Nombre </label>

      <input
        type="text"
        formControlName="nombre"
        id="nombre"
        name="nombre"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Enter your name"
      />
    </div>

    <!-- Correo -->
    <div class="mb-5">
      <label for="name" class="block mb-2 text-sm font-medium text-gray-900"> Correo </label>

      <input
        type="email"
        formControlName="correo"
        id="correo"
        name="correo"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Enter your name"
      />
    </div>

    <!-- Materia -->
    <div class="mb-5">
      <label for="name" class="block mb-2 text-sm font-medium text-gray-900"> Materia </label>

      <input
        type="text"
        formControlName="materia"
        id="materia"
        name="materia"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Enter your name"
      />
    </div>

    <div class="mb-5">
      <!-- Botones centrados -->
      <div class="flex justify-center gap-5 mt-5">
        <!-- Botón registrar -->
        <button
        
        (click)="muestraAlumno()"
          type="submit"
          class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medi um rounded-lg text-sm px-5 py-4.5 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Registrar
        </button>

        <!-- Botón cargar -->
        <button
        (click)="muestraAlumno()"
          type="button"
          class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Cargar
        </button>
      </div>
    </div>
  </form>

  <div>

      <h2 class="text-3xl font-bold text-gray-900 mb-6">Lista Alumnos</h2>
      <h3>MAtricula: {{nuevoAlumno.matricula}}</h3>
      <h3>Nombre: {{nuevoAlumno.nombre}}</h3>
      <h3>Correo: {{nuevoAlumno.correo}}</h3>
      <h3>Materia: {{nuevoAlumno.materia}}</h3>
      
    </div>
</div>
