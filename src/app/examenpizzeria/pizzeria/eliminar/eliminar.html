<div class="w-full max-w-[50rem] mx-auto p-4 md:p-6">
  <div class="relative p-[1px] bg-gradient-to-r from-red-500/50 via-gray-700 to-rose-500/50 rounded-3xl shadow-2xl overflow-hidden">
    <div class="bg-gray-950/95 backdrop-blur-2xl rounded-[23px] overflow-hidden">

      <!-- ENCABEZADO DE ADVERTENCIA -->
      <div class="px-8 py-6 border-b border-red-900/50 bg-gradient-to-r from-red-950/40 via-gray-900 to-gray-950 flex flex-col items-center text-center relative">
        <div class="p-4 bg-red-500/10 rounded-full mb-4 border border-red-500/20">
          <svg class="w-10 h-10 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
        </div>
        <h2 class="text-2xl md:text-3xl font-black tracking-tight text-white">
          ¿Eliminar este pedido?
        </h2>
        <p class="mt-2 text-sm text-red-400 font-medium">Esta acción es permanente y eliminará las pizzas asociadas en la base de datos.</p>
      </div>

      <div class="p-6 md:p-8">
        <form [formGroup]="formulario" (ngSubmit)="eliminarVenta()" class="space-y-6">
          
          <!-- DATOS DEL PEDIDO (Solo lectura) -->
          <div class="bg-gray-900/50 p-6 rounded-2xl border border-gray-800/80">
            <h3 class="text-lg font-bold text-red-400 mb-4 flex items-center gap-2">
              Resumen de la Venta <span class="text-white">#{{ idventa }}</span>
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label class="block mb-2 text-xs font-bold uppercase tracking-wider text-gray-500">Cliente</label>
                <input type="text" formControlName="nombre" class="block w-full p-3 text-sm text-gray-400 bg-gray-950 border border-gray-800 rounded-xl cursor-not-allowed">
              </div>
              <div>
                <label class="block mb-2 text-xs font-bold uppercase tracking-wider text-gray-500">Teléfono</label>
                <input type="text" formControlName="telefono" class="block w-full p-3 text-sm text-gray-400 bg-gray-950 border border-gray-800 rounded-xl cursor-not-allowed">
              </div>
              <div class="md:col-span-2">
                <label class="block mb-2 text-xs font-bold uppercase tracking-wider text-gray-500">Dirección</label>
                <input type="text" formControlName="direccion" class="block w-full p-3 text-sm text-gray-400 bg-gray-950 border border-gray-800 rounded-xl cursor-not-allowed">
              </div>
              <div class="md:col-span-2">
                <label class="block mb-2 text-xs font-bold uppercase tracking-wider text-gray-500">Total del Pedido</label>
                <input type="text" formControlName="total_pedido" class="block w-full p-3 text-lg font-bold text-red-500 bg-gray-950 border border-red-900/30 rounded-xl cursor-not-allowed">
              </div>
            </div>
          </div>

          <!-- BOTONES -->
          <div class="flex flex-col md:flex-row justify-end items-center gap-4 pt-4">
            <button type="button" [routerLink]="['/pizzeria/ventas']" 
              class="w-full md:w-auto text-gray-300 bg-gray-800 hover:bg-gray-700 focus:ring-4 focus:ring-gray-900 font-bold rounded-xl text-sm px-6 py-3.5 transition cursor-pointer">
              Cancelar
            </button>
            <button type="submit" 
              class="w-full md:w-auto text-white bg-gradient-to-r from-red-600 to-rose-700 hover:from-red-500 hover:to-rose-600 focus:ring-4 focus:ring-red-900 font-bold rounded-xl text-sm px-6 py-3.5 shadow-lg shadow-red-900/30 transition transform active:scale-95 cursor-pointer">
              Sí, Eliminar Pedido
            </button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
