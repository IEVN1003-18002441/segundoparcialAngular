<div class="min-h-screen flex justify-center items-center bg-gray-50 p-4">
  
  <div class="bg-neutral-primary-soft block max-w-sm w-full p-6 border border-default rounded-base shadow-xs bg-white">
    
    <a href="#">
      <img class="rounded-base w-full h-auto object-cover" src="assets/img/user.avif" alt="User" />
    </a>
    
    <a href="#">
      <h5 class="mt-6 mb-2 text-2xl font-semibold tracking-tight text-heading">
        ID Maestro: {{regMaestro.idmaestro}}
      </h5>
    </a>
    
    <p class="mb-2 text-body">
        Nombre: {{regMaestro.nombre}} | Apaterno: {{regMaestro.apaterno}}
    </p>
    <p class="mb-2 text-body">
        Amaterno: {{regMaestro.amaterno}}
    </p>
    <p class="mb-2 text-body">
        Correo: {{regMaestro.correo}}
    </p>
    
    <div class="flex gap-4 mt-6">
      
      <button
        (click)="eliminarMaestro()"
        class="inline-flex items-center text-white bg-red-600 hover:bg-red-700 focus:ring-4 focus:ring-red-300 shadow-xs font-medium leading-5 rounded-lg text-sm px-4 py-2.5 focus:outline-none transition-colors cursor-pointer"
      >
        Eliminar
        <svg class="w-4 h-4 ms-1.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 7h14m-9 3v8m4-8v8M10 3h4a1 1 0 0 1 1 1v3H9V4a1 1 0 0 1 1-1ZM6 7h12v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7Z"/>
        </svg>
      </button>

      <a
        [routerLink]="['/utl/maestros']"
        class="inline-flex items-center text-gray-900 bg-gray-200 border border-gray-300 hover:bg-gray-300 focus:ring-4 focus:ring-gray-100 shadow-xs font-medium leading-5 rounded-lg text-sm px-4 py-2.5 focus:outline-none transition-colors cursor-pointer"
      >
        Cancelar
        <svg
          class="w-4 h-4 ms-1.5 rtl:rotate-180 -me-0.5"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 12H5m14 0-4 4m4-4-4-4"
          />
        </svg>
      </a>

    </div>
  </div>
</div>
